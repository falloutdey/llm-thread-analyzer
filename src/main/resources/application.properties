# O sufixo [.properties] diz ao Spring como ler o .env (sem ele o arquivo pode ser ignorado).
spring.config.import=optional:file:.env[.properties]
server.port=8081

# =====================================================================
# Banco de dados
# H2 em ARQUIVO (pasta ./dados): os registros das sessões sobrevivem a reinícios.
# Antes era jdbc:h2:mem + create-drop, que apagava tudo ao parar o servidor.
# Para PostgreSQL (deploy), comente o bloco H2 e descomente o bloco abaixo.
# =====================================================================
spring.datasource.url=jdbc:h2:file:./dados/tutor;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# spring.datasource.url=jdbc:postgresql://localhost:5432/llm_thread_analyzer
# spring.datasource.username=postgres
# spring.datasource.password=${DB_PASSWORD}
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.hibernate.ddl-auto=update

# Não segurar conexão de banco durante a chamada ao LLM (que pode levar dezenas de segundos).
spring.jpa.open-in-view=false

# =====================================================================
# Fluxo antigo (/api/files/analisar e bateria) — continua usando LLMFeedbackService
# =====================================================================
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent

# =====================================================================
# Cadeia de modelos do tutor (ordem = ordem de tentativa)
# Modelo sem chave é ignorado na inicialização (aparece aviso no console).
# Confira os nomes dos modelos disponíveis para a sua chave antes da sessão com alunos.
# =====================================================================
# Decisão de 27/10/2026: o 3.5-flash-lite é o principal (≈1,9 s por resposta e seguiu melhor o formato
# nos testes locais); o 2.5-flash fica de reserva.
# 05/11/2026: Claude Haiku (Anthropic) e gpt-oss-120b (Groq) entraram como reservas, antes do 2.5-flash.
# 10/11/2026: os dois saíram da cadeia (não deram certo nos últimos testes); a cadeia volta a ser só Gemini.
# As configurações deles ficam abaixo, fora da cadeia, para referência.
llm.cadeia=gemini-flash-lite,gemini-flash
llm.fallback-habilitado=true
llm.timeout-conexao-ms=5000
llm.timeout-chamada-ms=30000
llm.prazo-total-ms=45000
llm.tentativas-por-modelo=1
# Se todos os modelos falharem por motivo temporário (503, tempo esgotado), tenta a cadeia de novo, dentro do prazo total.
llm.voltas-na-cadeia=2
llm.timeout-leitura-legado-ms=60000

# Reserva (usado quando o principal falha ou passa do tempo).
llm.modelos.gemini-flash.tipo=gemini
llm.modelos.gemini-flash.modelo=gemini-2.5-flash
llm.modelos.gemini-flash.chave=${GEMINI_API_KEY:}
llm.modelos.gemini-flash.temperatura=0.3
llm.modelos.gemini-flash.max-tokens=2048
# 0 = sem 'thinking': o raciocínio interno consumia o limite de tokens e cortava a resposta.
llm.modelos.gemini-flash.thinking-budget=0
llm.modelos.gemini-flash.intervalo-minimo-ms=4500

# Modelo principal. O gemini-2.5-flash-lite não está mais disponível para chaves novas (HTTP 404 em 27/10/2026);
# a própria API indicou o gemini-3.5-flash-lite. Série 3 usa thinking-level em vez de thinking-budget.
llm.modelos.gemini-flash-lite.tipo=gemini
llm.modelos.gemini-flash-lite.modelo=gemini-3.5-flash-lite
llm.modelos.gemini-flash-lite.chave=${GEMINI_API_KEY:}
llm.modelos.gemini-flash-lite.temperatura=0.3
llm.modelos.gemini-flash-lite.max-tokens=2048
llm.modelos.gemini-flash-lite.thinking-level=minimal
llm.modelos.gemini-flash-lite.intervalo-minimo-ms=4500

# Reserva de outro fornecedor: Claude Haiku (Anthropic), pago por uso.
# Chave em ANTHROPIC_API_KEY no .env. O modelo não aceita temperatura; o "thinking" fica desligado para responder mais rápido.
llm.modelos.claude-haiku.tipo=anthropic
llm.modelos.claude-haiku.modelo=claude-haiku-5-5
llm.modelos.claude-haiku.chave=${ANTHROPIC_API_KEY:}
llm.modelos.claude-haiku.max-tokens=2048
llm.modelos.claude-haiku.pensar=false
llm.modelos.claude-haiku.intervalo-minimo-ms=0

# Reserva de outro fornecedor: gpt-oss-120b pela Groq (API compatível com OpenAI). Chave em GROQ_API_KEY no .env.
# Plano gratuito (05/11/2026): 30 pedidos/min, 1000/dia, 8 mil tokens/min e 200 mil tokens/dia; como cada fala
# do tutor manda alguns milhares de tokens, o limite por minuto é o que pesa. esforco = reasoning_effort (low = mais rápido).
llm.modelos.groq-gpt-oss.tipo=openai
llm.modelos.groq-gpt-oss.url=https://api.groq.com/openai/v1/chat/completions
llm.modelos.groq-gpt-oss.modelo=openai/gpt-oss-120b
llm.modelos.groq-gpt-oss.chave=${GROQ_API_KEY:}
llm.modelos.groq-gpt-oss.temperatura=0.3
llm.modelos.groq-gpt-oss.max-tokens=2048
llm.modelos.groq-gpt-oss.esforco=low
# Esquema estrito: no teste de 05/11, em modo json_object o modelo às vezes respondia texto solto (erro 400 json_validate_failed)
# ou inventava valores fora da lista (ex.: avaliação "PEDIDO_SOLUCAO").
llm.modelos.groq-gpt-oss.esquema-estrito=true
llm.modelos.groq-gpt-oss.intervalo-minimo-ms=2000

# =====================================================================
# Tutor
# =====================================================================
# v1-explicativo = prompt original (linha de base); v2-socratico = escada de dicas com resposta em JSON.
# A versão fica gravada em cada conversa, então dá para trocar e comparar.
tutor.versao-prompt=v2-socratico
tutor.modo-padrao=HIBRIDO
# 40 (era 20): no teste de 04/11, uma conversa com dúvida de sintaxe chegou exatamente às 20 mensagens do aluno.
tutor.max-mensagens-aluno=40
tutor.max-caracteres-mensagem=2000
tutor.permitir-fallback=true

# Relatórios CSV: defina RELATORIO_TOKEN (vazio = relatórios desligados)
relatorio.token=${RELATORIO_TOKEN:}
# Rotas antigas /api/tutor/** (só para a bateria de robustez): exigem o cabeçalho X-Relatorio-Token.
# No servidor de produção, desligue com TUTOR_ROTAS_ANTIGAS=false.
tutor.rotas-antigas.habilitadas=${TUTOR_ROTAS_ANTIGAS:true}

# =====================================================================
# Login do Sumawma e projetos Java (/api/java/**)
# =====================================================================
# Mesmo JWT_SECRET do .env do backend Node do Sumawma: é com ele que o Node assina o token de login.
# Vazio = módulo Java sem login (as rotas /api/java respondem 503).
auth.jwt-secret=${JWT_SECRET:}
java.projetos.max-por-aluno=50
java.projetos.max-arquivos=30
java.projetos.max-caracteres-arquivo=100000

# =====================================================================
# Botão Executar do editor Java (/api/java/projetos/{id}/execucoes)
# O programa do aluno roda num processo separado, com Security Manager (sem acesso a arquivos,
# rede, variáveis de ambiente ou outros programas). O Security Manager só existe até o Java 23:
# o serviço precisa rodar com Java 21 a 23 para executar código de aluno.
# isolamento=nenhum desliga a proteção: só para teste na própria máquina, nunca com alunos.
# =====================================================================
java.execucao.limite-segundos=10
java.execucao.memoria-mb=128
java.execucao.max-caracteres-saida=50000
java.execucao.max-simultaneas=4
java.execucao.isolamento=security-manager
