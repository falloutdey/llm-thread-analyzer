# O sufixo [.properties] diz ao Spring como ler o .env (sem ele o arquivo pode ser ignorado).
spring.config.import=optional:file:.env[.properties]
server.port=8081

# =====================================================================
# Banco de dados
# H2 em ARQUIVO (pasta ./dados): os registros das sessões sobrevivem a reinícios.
# Antes era jdbc:h2:mem + create-drop, que apagava tudo ao parar o servidor.
# Para PostgreSQL (deploy), comente o bloco H2 e descomente o bloco abaixo.
# =====================================================================
spring.datasource.url=jdbc:h2:file:./dados/tutor;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# spring.datasource.url=jdbc:postgresql://localhost:5432/llm_thread_analyzer
# spring.datasource.username=postgres
# spring.datasource.password=${DB_PASSWORD}
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.hibernate.ddl-auto=update

# Não segurar conexão de banco durante a chamada ao LLM (que pode levar dezenas de segundos).
spring.jpa.open-in-view=false

# =====================================================================
# Fluxo antigo (/api/files/analisar e bateria) — continua usando LLMFeedbackService
# =====================================================================
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent

# =====================================================================
# Cadeia de modelos do tutor (ordem = ordem de tentativa)
# Modelo sem chave é ignorado na inicialização (aparece aviso no console).
# Confira os nomes dos modelos disponíveis para a sua chave antes da sessão com alunos.
# =====================================================================
# Decisão de 27/10/2026: o 3.5-flash-lite é o principal (≈1,9 s por resposta e seguiu melhor o formato
# nos testes locais); o 2.5-flash fica de reserva.
llm.cadeia=gemini-flash-lite,gemini-flash
llm.fallback-habilitado=true
llm.timeout-conexao-ms=5000
llm.timeout-chamada-ms=30000
llm.prazo-total-ms=45000
llm.tentativas-por-modelo=1
llm.timeout-leitura-legado-ms=60000

# Reserva (usado quando o principal falha ou passa do tempo).
llm.modelos.gemini-flash.tipo=gemini
llm.modelos.gemini-flash.modelo=gemini-2.5-flash
llm.modelos.gemini-flash.chave=${GEMINI_API_KEY:}
llm.modelos.gemini-flash.temperatura=0.3
llm.modelos.gemini-flash.max-tokens=2048
# 0 = sem 'thinking': o raciocínio interno consumia o limite de tokens e cortava a resposta.
llm.modelos.gemini-flash.thinking-budget=0
llm.modelos.gemini-flash.intervalo-minimo-ms=4500

# Modelo principal. O gemini-2.5-flash-lite não está mais disponível para chaves novas (HTTP 404 em 27/10/2026);
# a própria API indicou o gemini-3.5-flash-lite. Série 3 usa thinking-level em vez de thinking-budget.
llm.modelos.gemini-flash-lite.tipo=gemini
llm.modelos.gemini-flash-lite.modelo=gemini-3.5-flash-lite
llm.modelos.gemini-flash-lite.chave=${GEMINI_API_KEY:}
llm.modelos.gemini-flash-lite.temperatura=0.3
llm.modelos.gemini-flash-lite.max-tokens=2048
llm.modelos.gemini-flash-lite.thinking-level=minimal
llm.modelos.gemini-flash-lite.intervalo-minimo-ms=4500

# Exemplo de fornecedor diferente (API compatível com OpenAI). Para ativar:
# defina GROQ_API_KEY e acrescente groq-llama ao final de llm.cadeia.
# llm.modelos.groq-llama.tipo=openai
# llm.modelos.groq-llama.url=https://api.groq.com/openai/v1/chat/completions
# llm.modelos.groq-llama.modelo=llama-3.3-70b-versatile
# llm.modelos.groq-llama.chave=${GROQ_API_KEY:}

# =====================================================================
# Tutor
# =====================================================================
tutor.versao-prompt=v1-explicativo
tutor.modo-padrao=HIBRIDO
tutor.max-mensagens-aluno=20
tutor.max-caracteres-mensagem=2000
tutor.permitir-fallback=true

# Relatórios CSV: defina RELATORIO_TOKEN (vazio = relatórios desligados)
relatorio.token=${RELATORIO_TOKEN:}
